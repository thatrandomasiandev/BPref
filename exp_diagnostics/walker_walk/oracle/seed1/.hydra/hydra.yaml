hydra:
  run:
    dir: ./exp_diagnostics/${env}/${experiment_condition}/seed${seed}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - experiment_condition=oracle
    - env=walker_walk
    - seed=1
    - device=cpu
    - num_train_steps=8000
    - teacher_beta=-1
    - teacher_gamma=1
    - teacher_eps_mistake=0
    - teacher_eps_skip=0
    - teacher_eps_equal=0
    - diag_probe_steps=[25000,50000,8000]
    - num_train_steps=8000
    - num_seed_steps=1000
    - num_unsup_steps=2000
    - num_interact=2000
    - max_feedback=80
    - reward_batch=20
    - reward_update=5
    - eval_frequency=4000
    - num_eval_episodes=1
    - diag_holdout_pairs=64
    - diag_onpolicy_pairs=32
    - diag_train_clean_pairs=32
    - diag_probe_gradient_steps=20
    - diag_probe_steps=[8000]
    - agent.batch_size=256
    - log_save_tb=false
  job:
    name: train_pebble_diagnostics
    chdir: null
    override_dirname: agent.batch_size=256,device=cpu,diag_holdout_pairs=64,diag_onpolicy_pairs=32,diag_probe_gradient_steps=20,diag_probe_steps=[25000,50000,8000],diag_probe_steps=[8000],diag_train_clean_pairs=32,env=walker_walk,eval_frequency=4000,experiment_condition=oracle,log_save_tb=false,max_feedback=80,num_eval_episodes=1,num_interact=2000,num_seed_steps=1000,num_train_steps=8000,num_train_steps=8000,num_unsup_steps=2000,reward_batch=20,reward_update=5,seed=1,teacher_beta=-1,teacher_eps_equal=0,teacher_eps_mistake=0,teacher_eps_skip=0,teacher_gamma=1
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.6
    version_base: '1.3'
    cwd: /Users/joshuaterranova/Desktop/Coding Projects/LiraLab/repos/BPref
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/joshuaterranova/Desktop/Coding Projects/LiraLab/repos/BPref/experiments/reward_failure_mode
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/joshuaterranova/Desktop/Coding Projects/LiraLab/repos/BPref/exp_diagnostics/walker_walk/oracle/seed1
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
